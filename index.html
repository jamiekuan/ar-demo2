<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene
      vr-mode-ui="enabled: false;"
      loading-screen="enabled: false;"
      renderer="logarithmicDepthBuffer: true;"
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
      id="scene"
      embedded
      gesture-detector
    >
      <a-assets>
        <a-asset-item id="animated-asset" src="asset.gltf"></a-asset-item>
      </a-assets>

      <a-marker
        id="animated-marker"
        type="pattern"
        preset="custom"
        url="marker.patt"
        raycaster="objects: .clickable"
        emitevents="true"
        cursor="fuse: false; rayOrigin: mouse;"
      >
        <a-entity
          id="bowser-model"
          scale="1 1 1"
          animation-mixer="loop: repeat"
          gltf-model="#animated-asset"
          class="clickable"
          gesture-handler
        ></a-entity>

        <a-text
          id="story-text"
          value="Congrats! You've found the right treasure!"
          position="-1 2 -0.5"
          rotation="-90 0 0"
          color="white"
          width="1.6"
          class="clickable"
        ></a-text>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <!-- 自動播放文字腳本 -->
    <script>
      const textList = [
        "Congrats! You've found the right treasure!",
        "I'm a butterfly from Giverny,",
        "a small village in France.",
        "We’re truly grateful...",
        "that Monet painted our village",
        "so beautifully."
      ];

      let textIndex = 0;
      document.addEventListener("DOMContentLoaded", () => {
        const textEl = document.querySelector("#story-text");

        function showNextText() {
          if (textIndex < textList.length - 1) {
            textIndex++;
            textEl.setAttribute("value", textList[textIndex]);
            const delay = textIndex === 1 ? 3000 : 3000; // 每句3秒（第一句已顯示5秒）
            setTimeout(showNextText, delay);
          }
        }

        // 第一句維持5秒，再開始切換後續文字
        setTimeout(showNextText, 5000);
      });
    </script>
  </body>
</html>
